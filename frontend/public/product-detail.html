<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Detalle de Publicación - UcabMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark navbar-ucab px-4">
    <a class="navbar-brand fw-bold" href="catalog.html">UcabMarket</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="catalog.html"><i class="bi bi-grid me-1"></i> Catálogo</a>
      <a class="nav-link" href="profile.html"><i class="bi bi-person me-1"></i> Perfil</a>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row">
      <!-- Galería de fotos (máx 5 fotos) -->
      <div class="col-md-6 mb-4">
        <div class="card border-0 shadow-sm p-3">
          <div id="galeriaFotos" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner" id="carouselInner">
              <!-- Fotos renderizadas dinámicamente -->
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#galeriaFotos" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#galeriaFotos" data-bs-slide="next">
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Información del Producto y Vendedor -->
      <div class="col-md-6">
        <div class="card border-0 shadow-sm p-4 h-100 d-flex flex-column justify-content-between">
          <div>
            <span id="prodCategoria" class="badge bg-secondary mb-2">Categoría</span>
            <h2 id="prodTitulo" class="fw-bold mb-2">Cargando producto...</h2>
            <h3 id="prodPrecio" class="text-primary fw-bold mb-3">$0.00</h3>
            <p id="prodDescripcion" class="text-secondary mb-4">Descripción detallada...</p>
            
            <div class="p-3 bg-light rounded-3 mb-4">
              <h6 class="fw-bold mb-1">Información del Vendedor:</h6>
              <p id="vendedorNombre" class="mb-1">Estudiante UCAB</p>
              <!-- Enlace directo a las reseñas del perfil del estudiante -->
              <a id="linkPerfilVendedor" href="profile.html" class="small text-decoration-none fw-semibold">
                <i class="bi bi-star-fill text-warning me-1"></i> Ver reputación y reseñas en su perfil
              </a>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button id="btnContactarChat" class="btn btn-primary btn-lg"><i class="bi bi-chat-dots-fill me-2"></i> Contactar vendedor</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Sección de Preguntas Públicas sobre el Producto -->
    <div class="row mt-5">
      <div class="col-12">
        <div class="card border-0 shadow-sm p-4">
          <h4 class="fw-bold mb-3">Preguntas y Respuestas Públicas</h4>
          
          <form id="formNuevaPregunta" class="mb-4">
            <div class="input-group">
              <input type="text" id="inputNuevaPregunta" class="form-control" placeholder="Hazle una pregunta pública al vendedor..." required>
              <button class="btn btn-primary px-4" type="submit">Preguntar</button>
            </div>
          </form>

          <div id="contenedorPreguntas">
            <!-- Renderizado dinámico vía questions.js -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/questions.js"></script>
  <script src="assets/js/crear-chat.js"></script>
  <script src="assets/js/products.js"></script>
</body>
</html>
