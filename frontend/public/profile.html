<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil de Usuario - UcabMarket</title>
  <!-- Bootstrap 5 CDN (sin lib/ local para aligerar repositorio y aprovechar caché) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
  <!-- Barra de Navegación -->
  <nav class="navbar navbar-expand navbar-dark navbar-ucab px-4">
    <a class="navbar-brand fw-bold" href="catalog.html">UcabMarket</a>
    <div class="navbar-nav ms-auto align-items-center">
      <a class="nav-link" href="catalog.html"><i class="bi bi-grid me-1"></i> Catálogo</a>
      <a class="nav-link active" href="profile.html"><i class="bi bi-person me-1"></i> Mi Perfil</a>
      <button class="btn btn-outline-light btn-sm ms-3" onclick="api.clearSession(); window.location.href='index.html';">Cerrar Sesión</button>
    </div>
  </nav>

  <div class="container my-5">
    <div class="row">
      <!-- Datos del Perfil -->
      <div class="col-md-4">
        <div class="card shadow-sm border-0 mb-4 text-center p-4">
          <div class="rounded-circle bg-primary text-white d-inline-flex justify-content-center align-items-center mx-auto mb-3" style="width: 80px; height: 80px; font-size: 2rem;">
            <i class="bi bi-person-fill"></i>
          </div>
          <h4 id="perfilNombre" class="fw-bold mb-1">Cargando...</h4>
          <p id="perfilEmail" class="text-muted small mb-1">usuario@ucab.edu.ve</p>
          <span id="perfilCarrera" class="badge bg-secondary mb-3">Carrera UCAB</span>
          
          <!-- Badge de Reputación Comunitario (Sprint 1) -->
          <div class="alert alert-warning py-2 mb-3">
            <span id="reputacionPromedio" class="fw-bold">★ 5.0 / 5 (0 opiniones)</span>
          </div>

          <button id="btnEditarPerfil" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modalEditarPerfil">
            <i class="bi bi-pencil me-1"></i> Editar Información
          </button>
        </div>
      </div>

      <!-- Pestañas: Publicaciones y Reseñas de Confianza -->
      <div class="col-md-8">
        <div class="card shadow-sm border-0 p-4">
          <ul class="nav nav-tabs mb-4" id="perfilTabs" role="tablist">
            <li class="nav-item">
              <button class="nav-link active fw-semibold" id="productos-tab" data-bs-toggle="tab" data-bs-target="#tab-productos" type="button">
                Publicaciones Activas
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link fw-semibold" id="resenas-tab" data-bs-toggle="tab" data-bs-target="#tab-resenas" type="button">
                Reseñas de Confianza (Sprint 1)
              </button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- Pestaña Publicaciones -->
            <div class="tab-pane fade show active" id="tab-productos">
              <div id="productosUsuario" class="row">
                <!-- Se cargan dinámicamente con profile.js -->
              </div>
            </div>

            <!-- Pestaña Reseñas (Justificación: La confianza evalúa al estudiante miembro) -->
            <div class="tab-pane fade" id="tab-resenas">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0">Opiniones de la Comunidad UCAB</h5>
                <button class="btn btn-sm btn-success" data-bs-toggle="modal" data-bs-target="#modalNuevaResena">
                  <i class="bi bi-star-fill me-1"></i> Añadir Reseña
                </button>
              </div>
              <div id="listaResenas">
                <!-- Se cargan dinámicamente con reviews.js -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts: Configuración, API, Perfil y Reseñas -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/reviews.js"></script>
  <script src="assets/js/profile.js"></script>
</body>
</html>
