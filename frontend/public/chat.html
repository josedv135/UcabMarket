<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Chat de Negociación - UcabMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>

<body>
  <nav class="navbar navbar-expand navbar-dark navbar-ucab px-4">
    <a class="navbar-brand fw-bold" href="catalog.html">UcabMarket</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="catalog.html"><i class="bi bi-arrow-left me-1"></i> Volver al Catálogo</a>
    </div>
  </nav>

  <div class="container my-4">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
        <div>
          <h5 class="fw-bold mb-0">Conversación de Compra / Entrega</h5>
          <small class="text-muted"><i class="bi bi-shield-check text-success me-1"></i> Canal cifrado y privado para
            miembros de la comunidad UCAB (ISO 25010)</small>
        </div>
      </div>

      <!-- Contenedor con scroll de mensajes en tiempo real -->
      <div id="mensajesContainer" class="card-body p-4 chat-box">
        <!-- Renderizado dinámico vía Socket.IO en chat.js -->
      </div>

      <!-- Barra de entrada de texto y adjunto de archivos -->
      <div class="card-footer bg-light p-3">
        <form id="chatForm" class="d-flex align-items-center gap-2">
          <label class="btn btn-outline-secondary mb-0" title="Adjuntar foto o documento">
            <i class="bi bi-paperclip"></i>
            <input type="file" id="archivoInput" class="d-none" accept=".jpg,.jpeg,.png,.webp,.pdf,.docx,.zip">
          </label>
          <input type="text" id="mensajeInput" class="form-control"
            placeholder="Escribe un mensaje acordando punto en el campus..." autocomplete="off">
          <button type="submit" class="btn btn-primary px-4"><i class="bi bi-send-fill me-1"></i> Enviar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Cliente Socket.IO por CDN oficial -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/chat.js"></script>
</body>

</html>

<!-- Cliente Socket.IO por CDN oficial -->
