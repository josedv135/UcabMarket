<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <title>Chat - UcabMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark navbar-ucab px-4">
    <a class="navbar-brand navbar-logo fw-bold" href="catalog.html"><span class="navbar-logo-icono"><img src="assets/img/logo-ucabmarket.png" alt=""></span>UcabMarket</a>
  </nav>

  <div class="container my-4">
    <div class="card shadow-sm border-0">
      <!-- 7.- Muestra el chat sin datos personales: solo nombres y producto (CA3) -->
      <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
        <div>
          <h5 class="fw-bold mb-0" id="chatTitulo">Cargando chat...</h5>
          <small class="text-muted" id="chatProducto"></small>
        </div>
        <small class="text-muted"><i class="bi bi-shield-lock text-success me-1"></i> Solo ustedes dos pueden escribir aquí</small>
      </div>

      <div id="chatAviso" class="alert alert-danger m-3 mb-0" role="alert" hidden></div>

      <div id="mensajesContainer" class="card-body p-4 chat-box">
        <p id="chatVacio" class="text-muted text-center my-5" hidden>Todavía no hay mensajes. Escribe el primero.</p>
      </div>

      <!-- 8.- Escribe el mensaje · 9.- Presiona «Enviar» o «Salir» -->
      <div class="card-footer bg-light p-3">
        <form id="chatForm" class="d-flex align-items-center gap-2">
          <input type="text" id="mensajeInput" class="form-control" placeholder="Escribe un mensaje para coordinar la compra..." maxlength="1000" autocomplete="off" aria-label="Mensaje">
          <button type="submit" id="btnEnviar" class="btn btn-primary px-4"><i class="bi bi-send-fill me-1"></i> Enviar</button>
          <button type="button" id="btnSalir" class="btn btn-outline-secondary px-4">Salir</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Cliente Socket.IO por CDN oficial -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/chat.js"></script>
</body>
</html>
